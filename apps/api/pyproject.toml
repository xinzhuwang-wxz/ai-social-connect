[project]
name = "cofield-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "networkx>=3.6.1",
    "faker>=40.36.0",
    "numpy>=2.5.2",
    "ortools>=9.15.6755",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "testcontainers[postgres]>=4.9",
    "mypy>=1.13",
    "ruff>=0.8",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cofield"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[[tool.mypy.overrides]]
# networkx 没有官方 stub；它只在仿真人口生成里用，不进领域层。
module = ["networkx.*"]
ignore_missing_imports = true

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["cofield"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
